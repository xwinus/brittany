conf_layout:
  lconfig_allowSingleLineExportList: true
  lconfig_importAsColumn: 60
  lconfig_importColumn: 60

# Omit output validity check for GHC 9.14 port: exactPrint/validation can
# fail on some constructs; we still compare output to golden files.
# Omit unused comment check: annotation extraction doesn't yet align with
# layout consumption; unprocessed comments would otherwise fail tests.
conf_errorHandling:
  econf_omit_output_valid_check: true
  econf_omit_unused_comment_check: true
