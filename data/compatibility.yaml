schema-version: 1

# Support modes are conservative. Follow-up issues promote exact-source entries
# to native only after their AST paths have dedicated regression coverage.
features:
  - name: Haskell2010
    kind: edition
    support: native
    tracking-issue: 13
  - name: GHC2021
    kind: edition
    support: native
    tracking-issue: 13
  - name: GHC2024
    kind: edition
    support: native
    tracking-issue: 13
  - name: BangPatterns
    kind: extension
    support: exact-source
    tracking-issue: 17
  - name: CPP
    kind: extension
    support: unsupported
    tracking-issue: 18
  - name: DatatypeContexts
    kind: extension
    support: exact-source
    tracking-issue: 16
  - name: DerivingVia
    kind: extension
    support: exact-source
    tracking-issue: 16
  - name: ExistentialQuantification
    kind: extension
    support: exact-source
    tracking-issue: 16
  - name: ExplicitNamespaces
    kind: extension
    support: exact-source
    tracking-issue: 14
  - name: ForeignFunctionInterface
    kind: extension
