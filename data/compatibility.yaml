cases:
  - name: formats a Haskell2010 module with comments
    kind: expected
    fixture: source/test-suite/fixtures/CompatibilityHaskell2010Expected.hs
    features: [Haskell2010]
    expected-result: formats
  - name: formats a GHC2021 module idempotently
    kind: expected
    fixture: source/test-suite/fixtures/CompatibilityGHC2021Expected.hs
    features: [GHC2021]
    expected-result: formats
  - name: preserves comments at a GHC2024 syntax boundary
    kind: edge
    fixture: source/test-suite/fixtures/CompatibilityGHC2024Edge.hs
    features: [GHC2024]
    expected-result: formats
  - name: rejects malformed input under GHC2024
    kind: malformed
    fixture: source/test-suite/fixtures/CompatibilityGHC2024Invalid.hs
    features: [GHC2024]
    expected-result: parse-failure
  - name: classifies bang patterns
    kind: expected
    fixture: data/Test172.hs
    features: [BangPatterns]
    expected-result: formats
  - name: classifies legacy datatype contexts
    kind: expected
    fixture: data/Test51.hs
    features: [DatatypeContexts]
    expected-result: formats
  - name: classifies deriving via
    kind: edge
    fixture: source/test-suite/fixtures/DeclarationCommentsEdge.hs
    features: [DerivingVia]
    expected-result: formats
  - name: classifies existential quantification
    kind: expected
    fixture: data/Test60.hs
    features: [ExistentialQuantification]
    expected-result: formats
  - name: classifies namespaces and pattern synonyms
    kind: expected
    fixture: data/Test237.hs
    features: [ExplicitNamespaces, PatternSynonyms]
    expected-result: formats
  - name: rejects unsafe foreign declaration comments
    kind: unsupported
    fixture: source/test-suite/fixtures/CommentPreservationForeignLost.hs
    features: [ForeignFunctionInterface]
    expected-result: formatting-failure
  - name: classifies GADTs and type family dependencies
    kind: edge
    fixture: source/test-suite/fixtures/FamilyCommentsEdge.hs
    features: [GADTs, TypeFamilies, TypeFamilyDependencies]
    expected-result: formats
  - name: classifies implicit parameters
    kind: expected
    fixture: data/Test233.hs
    features: [ImplicitParams]
    expected-result: formats
  - name: classifies rank-n types and kind signatures
    kind: edge
