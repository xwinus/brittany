cases:
  - name: formats a Haskell2010 module with comments
    kind: expected
    fixture: source/test-suite/fixtures/CompatibilityHaskell2010Expected.hs
    features: [Haskell2010]
    expected-result: formats
  - name: formats a GHC2021 module idempotently
    kind: expected
    fixture: source/test-suite/fixtures/CompatibilityGHC2021Expected.hs
    features: [GHC2021]
    expected-result: formats
  - name: preserves comments at a GHC2024 syntax boundary
    kind: edge
    fixture: source/test-suite/fixtures/CompatibilityGHC2024Edge.hs
    features: [GHC2024]
    expected-result: formats
  - name: rejects malformed input under GHC2024
    kind: malformed
    fixture: source/test-suite/fixtures/CompatibilityGHC2024Invalid.hs
    features: [GHC2024]
    expected-result: parse-failure
  - name: formats a module header and export list
    kind: expected
    fixture: data/Test132.hs
    features: [ModuleHeaders, ExportLists]
    expected-result: formats
  - name: preserves comments around module exports
    kind: edge
    fixture: data/Test138.hs
    features: [ModuleHeaders, ExportLists]
    expected-result: formats
  - name: rejects a malformed module export list
    kind: malformed
    fixture: source/test-suite/fixtures/ModuleSyntaxInvalid.hs
    features: [ModuleHeaders, ExportLists]
    expected-result: parse-failure
  - name: formats a multiple-constructor data declaration natively
    kind: expected
