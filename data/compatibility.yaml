    features: [MultiWayIf]
    expected-result: formats
  - name: classifies multiline strings
    kind: edge
    fixture: data/Test544.hs
    features: [MultilineStrings]
    expected-result: formats
  - name: classifies named defaults
    kind: expected
    fixture: data/Test547.hs
    features: [NamedDefaults]
    expected-result: formats
  - name: classifies or-patterns
    kind: edge
    fixture: data/Test543.hs
    features: [OrPatterns]
    expected-result: formats
  - name: classifies overloaded labels
