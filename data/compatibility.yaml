    tracking-issue: 18
  - name: GADTs
    kind: extension
    support: exact-source
    tracking-issue: 16
  - name: ImplicitParams
    kind: extension
    support: exact-source
    tracking-issue: 16
  - name: KindSignatures
    kind: extension
