name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHC_VERSION: 9.14.1
  CABAL_VERSION: 3.16.1.0
  EXPECTED_TEST_SUMMARY: 757 examples, 0 failures

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Haskell
        id: setup-haskell
        uses: haskell-actions/setup@v2.11.0
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Cache Cabal store
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ runner.os }}-${{ runner.arch }}-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-${{ hashFiles('brittany.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-

      - name: Check package metadata
        run: cabal check

      - name: Build
        run: cabal build all

      - name: Run full test suite
        run: |
          cabal test all \
            --test-show-details=direct \
            --test-options='--format=progress --no-color' 2>&1 | tee test-output.log
          grep -F "$EXPECTED_TEST_SUMMARY" test-output.log

  source-distribution:
    name: Test source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Haskell
        id: setup-haskell
        uses: haskell-actions/setup@v2.11.0
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Cache Cabal store
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ runner.os }}-${{ runner.arch }}-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-${{ hashFiles('brittany.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-

      - name: Create source distribution
        run: cabal sdist

      - name: Unpack source distribution
        id: unpack
        run: |
          archive=$(find dist-newstyle/sdist -maxdepth 1 -name 'brittany-*.tar.gz' -print -quit)
          test -n "$archive"
          mkdir unpacked
          tar -xzf "$archive" -C unpacked
          package_dir=$(find "$PWD/unpacked" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$package_dir"
          echo "package_dir=$package_dir" >> "$GITHUB_OUTPUT"

      - name: Check packaged metadata
        working-directory: ${{ steps.unpack.outputs.package_dir }}
        run: cabal check

      - name: Build packaged sources
        working-directory: ${{ steps.unpack.outputs.package_dir }}
        run: cabal build all

      - name: Test packaged sources
        working-directory: ${{ steps.unpack.outputs.package_dir }}
        run: |
          cabal test all \
            --test-show-details=direct \
            --test-options='--format=progress --no-color' 2>&1 | tee test-output.log
          grep -F "$EXPECTED_TEST_SUMMARY" test-output.log
